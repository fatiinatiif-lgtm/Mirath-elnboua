name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project files
        run: |
          unzip -o code.zip
          unzip -o books_small.zip
          unzip -o books_17.zip
          unzip -o books_18.zip
          ls assets/books | wc -l
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Regenerate Android project with current Flutter
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp -r lib /tmp/lib.bak
          rm -rf android
          flutter create --platforms=android --project-name mirath_alnobowa --org com.mirath .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          rm -rf lib
          cp -r /tmp/lib.bak lib
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="ميراث النبوة"/' android/app/src/main/AndroidManifest.xml
          grep label android/app/src/main/AndroidManifest.xml
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirath-nobowa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
