name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project files
        run: |
          unzip -o code.zip
          for f in books_*.zip; do unzip -o "$f"; done
          for p in assets/books/*.part1; do [ -e "$p" ] || continue; b="${p%.part1}"; cat "$b".part* > "$b"; rm -f "$b".part*; done
          ls assets/books | wc -l
      - name: Download decorative font (optional)
        run: |
          mkdir -p assets/fonts
          for name in ArefRuqaa-Regular.ttf ArefRuqaa-Bold.ttf; do
            for base in "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa" "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/arefruqaa"; do
              curl -fsSL --retry 2 "$base/$name" -o "assets/fonts/$name" || true
              if [ -s "assets/fonts/$name" ] && [ "$(stat -c%s "assets/fonts/$name")" -gt 10000 ]; then break; fi
              rm -f "assets/fonts/$name"
            done
          done
          if [ ! -s assets/fonts/ArefRuqaa-Regular.ttf ] || [ ! -s assets/fonts/ArefRuqaa-Bold.ttf ]; then
            echo "Font download failed - building without the decorative font"
            rm -rf assets/fonts
            sed -i '/# FONTS-START/,/# FONTS-END/d' pubspec.yaml
          fi
          ls -la assets/fonts || true
          tail -12 pubspec.yaml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Regenerate Android project with current Flutter
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp -r lib /tmp/lib.bak
          rm -rf android
          flutter create --platforms=android --project-name mirath_alnobowa --org com.mirath .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          rm -rf lib
          cp -r /tmp/lib.bak lib
          rm -rf test
          rm -rf android/app/src/main/res/mipmap-anydpi*
          cp -r icons/. android/app/src/main/res/
          sed -i 's/android:label="[^"]*"/android:label="ميراث النبوة"/' android/app/src/main/AndroidManifest.xml
          grep label android/app/src/main/AndroidManifest.xml
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirath-nobowa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
